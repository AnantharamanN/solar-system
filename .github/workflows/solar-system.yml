name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  
  unit-testing:
    name: Unit testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Setup NodeJS Version - 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Cache npm dependencies
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}

    - name: Install dependencies
      run: npm install

    - name: Unit testing
      id: unit_testing_step
      run: npm test

    - name: Archive test results
      if: (failure() && steps.unit_testing_step.outcome == 'failure') || (success() && steps.unit_testing_step.outcome == 'success')
      uses: actions/upload-artifact@v4
      with:
        name: Mocha-Test-Results
        path: test-results.xml

  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Setup NodeJS Version - 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Cache npm dependencies
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}

    - name: Install dependencies
      run: npm install

    - name: Run code coverage
      continue-on-error: true
      run: npm run coverage

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: Code-Coverage-Results
        path: coverage
        retention-days: 5

  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        
      - name: Dockerhub login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: anantharamann 
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

      - name: Docker Image testing
        run: |
          docker images
          docker run --name solar-system-app -d \
                -p 3000:3000 \
                -e MONGO_URI=${{ env.MONGO_URI }} \
                -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
                -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
                ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

          export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo "Container IP: $IP"

          echo Testing image using wget
          wget -q -O - 127.0.0.1:3000/live || grep live

      - name: Container registry Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: | 
            ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
            ghcr.io/anantharamann/solar-system:${{ github.sha }}
      
  dev-deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install kubectl cli
      uses: azure/setup-kubectl@v4
      with:
        version: '1.26.0' # default is latest stable

    - name: Fetch K8s cluster details
      run: |
        kubectl version --short
        echo ---------------------------------------
        kubectl get nodes
